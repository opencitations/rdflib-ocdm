[project]
name = "rdflib-ocdm"
version = "2.0.1"
description = ""
authors = [{name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it"}]
license = "ISC"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "oc-ocdm>=11.0.22,<12",
    "rdflib>=7.6.0,<8",
    "redis>=7.4.1,<8",
    "sparqlwrapper>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2,<8",
    "fakeredis>=2.36.2,<3",
    "genbadge[coverage]>=1.1.3,<2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "reuse>=6.2.0",
    "ruff>=0.15.22",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
python_files = "*_test.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["rdflib_ocdm"]
branch = true
command_line = "-m pytest test/"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
